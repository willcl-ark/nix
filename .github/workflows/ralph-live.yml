name: Ralph live comparison

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Ralph PR number to compare
        required: true
        type: string
      head_sha:
        description: Full HEAD commit SHA you have reviewed and approved
        required: true
        type: string
      bitcoin_pr:
        description: Public bitcoin/bitcoin PR number to use as the review case
        required: true
        default: "36665"
        type: string
      proxy_url:
        description: CLIProxyAPI HTTPS URL over Tailscale, ending in /v1
        required: true
        default: "https://nero.tail1977.ts.net:8443/v1"
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ralph-live
  cancel-in-progress: false

jobs:
  compare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: pkgs/ralph:pkgs/ralph-service
    steps:
      # The approved PR is fetched as Git objects by prepare, never checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate approved PR and freeze the GitHub review case
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RALPH_PR: ${{ inputs.pull_request }}
          APPROVED_SHA: ${{ inputs.head_sha }}
          BITCOIN_PR: ${{ inputs.bitcoin_pr }}
          PROXY_URL: ${{ inputs.proxy_url }}
        run: |
          python3 -m ralph_service.ci_compare prepare \
            --repository-dir "$GITHUB_WORKSPACE" \
            --github-repository "$GH_REPOSITORY" \
            --pull-request "$RALPH_PR" \
            --head-sha "$APPROVED_SHA" \
            --bitcoin-pr "$BITCOIN_PR" \
            --proxy-url "$PROXY_URL" \
            --work-dir "$RUNNER_TEMP/ralph-comparison"
      - name: Connect to the inference proxy
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: ralph-ci-${{ github.run_id }}-${{ github.run_attempt }}
          use-cache: "false"
      - name: Review the frozen case with BASE and HEAD settings
        env:
          CLI_PROXY_API_KEY: ${{ secrets.CLI_PROXY_API_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/ralph-proxy-key"
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s' "$CLI_PROXY_API_KEY" > "$key_file"
          unset CLI_PROXY_API_KEY
          python3 -m ralph_service.ci_compare run \
            --work-dir "$RUNNER_TEMP/ralph-comparison" \
            --openai-key-file "$key_file"
      - name: Summarize the comparison
        if: always()
        run: |
          summary="$RUNNER_TEMP/ralph-comparison/results/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ralph-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ralph-comparison/results
          if-no-files-found: warn
          retention-days: 14
