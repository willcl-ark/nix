name: Ralph checks

on:
  pull_request:
    paths:
      - pkgs/ralph/**
      - pkgs/ralph-service/**
      - .github/workflows/ralph-*.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: pkgs/ralph:pkgs/ralph-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate agent settings and templates
        run: python3 pkgs/ralph/review.py check-agents
      - name: Test Ralph and service integration
        run: |
          python3 -m unittest discover -s pkgs/ralph -p 'test_*.py'
          python3 -m unittest discover -s pkgs/ralph-service -p 'test_*.py'
      - name: Render comment previews
        run: |
          mkdir -p "$RUNNER_TEMP/ralph-previews"
          python3 pkgs/ralph/final_comment/preview.py > "$RUNNER_TEMP/ralph-previews/review.md"
          python3 pkgs/ralph/final_comment/preview.py --github > "$RUNNER_TEMP/ralph-previews/github.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ralph-comment-previews
          path: ${{ runner.temp }}/ralph-previews
          if-no-files-found: error
          retention-days: 14
