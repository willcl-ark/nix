prompt = "prompt.md"
tool_set = "full"
model = "claude-haiku-5-5"
reasoning_effort = "xhigh"
max_output_tokens = 32000
max_tool_calls = { routine = 12, standard = 24, sensitive = 48 }
max_context_calls = 8
max_history_calls = 8
max_web_search_calls_per_response = 2
timeout = 1800
final_timeout = 1800

[profiles.high]
model = "gpt-6.1-sol"
reasoning_effort = "high"
max_output_tokens = 16000
