prompt = "prompt.md"
tool_set = "research"
model = "claude-opus-5-5"
reasoning_effort = "medium"
max_output_tokens = 128000
max_tool_calls = { routine = 64, standard = 64, sensitive = 64 }
max_context_calls = 8
max_history_calls = 8
max_web_search_calls_per_response = 2
timeout = 1800
final_timeout = 1800
