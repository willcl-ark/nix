prompt = "prompt.md"
tool_set = "research"
model = "gpt-6.1-sol"
reasoning_effort = "high"
max_output_tokens = 16000
max_tool_calls = { routine = 40, standard = 40, sensitive = 40 }
max_context_calls = 24
max_history_calls = 8
max_web_search_calls_per_response = 2
timeout = 1800
final_timeout = 1800
